<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Village — Jeu de gestion médiéval</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div id="resources">
      <span id="res-wood">🪵 60</span>
      <span id="res-food">🌾 50</span>
      <span id="res-gold">💰 25</span>
      <span id="res-pop">👥 4 +2👶</span>
      <span id="res-time">An 1 · Printemps</span>
    </div>

    <button id="speed-btn">▶ x1</button>

    <div id="build-panel">
      <h3>🔨 Construire</h3>
      <div id="build-buttons"></div>
    </div>

    <div id="info-panel">
      <p id="info-text">Sélectionnez un bâtiment, puis cliquez sur la carte pour le placer.</p>
    </div>

    <div id="log-panel">
      <h4>Événements</h4>
      <ul id="event-log"></ul>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/map.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/building.js"></script>
<script src="js/inhabitant.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
